<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>applications</title>
<link rel="icon" type="image/png" href="icon.webp">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<link rel="shortcut icon" href="icon.webp" type="image/png">
<meta name="viewport" content="width=device-1000" />
<meta name="description" content="all apps MaxtoCantona. it here.">

<style>
  * {
    box-sizing:border-box;
  }
    :root{  
    --bg:#050816;  
    --card:rgba(12,18,40,.78);  
    --text:#f5f7ff;  
    --muted:#a4aed6;  
    --line:rgba(110,231,255,.22);  
    --neon:#00ffd5;  
    --neon2:#a855f7;  
    --success:#10b981;  
    --error:#ef4444;  
    --shadow:0 0 18px rgba(110,231,255,.18), 0 0 36px rgba(168,85,247,.12);  
  } 
  body {
    font-family: sans-serif;
    background:  
      radial-gradient(circle at top left, rgba(110,231,255,.14), transparent 24%),  
      radial-gradient(circle at top right, rgba(168,85,247,.12), transparent 28%),  
      linear-gradient(180deg, #040711 0%, #050816 100%); 
    display: flex;
    flex-direction: column;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
    color: #fff;
  }

  h2 {
    text-align: center;
    margin-bottom: 2vh;
    font-size: 1.5vh;
    width: 100%;
  }
  .app-list {
    display: flex;
    flex-direction: column;
    gap: 1vh;
    align-items: flex-start;
  justify-content: flex-start;
    padding: 0 .80vh;
    height: 80vh;
    width: 90%;  
    overflow-y: scroll;    
    overflow-x: hidden;
  }
  .app-list::-webkit-scrollbar {
  width: .5vw;
}

.app-list::-webkit-scrollbar-track {
  background: #222;
}

.app-list::-webkit-scrollbar-thumb {
  background: #0ef;
  border-radius: 10px;
}

.app-list::-webkit-scrollbar-thumb:hover {
  background: #fff;
}

  .app-card {   
    background: transparent;
    border-radius: .40vh;
    width: 80%;
    height: 6vh;
    flex-shrink: 0;
    display: flex;
    flex-direction: row;
    gap: .5vh;
    align-items: center;
    padding-left: .2vh;
    margin: .50vh 0;
  justify-content: flex-start;   
    transition: transform 0.2s, border 0.3s;
  }

  .app-card.focused {
    box-shadow: 0 0 20px 2px #00ffd5;
    border-color: #00ffd5;
  }



  .app-card img {
    width: 6vh;
    height: 6vh;
    border-radius: 1vh;
    margin-right: 1vh;
    object-fit: cover;     
  }

  .app-card .texts {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-start;
    gap: .20vh;
    width: 80%;
    height: 90%;    
  }
  .texts .h3 {
    font-size: 1.3vh;
    color: #fff;
  }

  .line_card {
    display: flex;
    flex-direction: row;
    gap: .40vh;
    align-items: center;
  }
   .line_card .watermark {
    font-size: 1vh;
    text-transform: uppercase;
    color: #0ef;
  }
  .line_card .category {
    font-size: 1vh;
  }
  .line_card .dot {
    font-size: 1vh;
  }
  .texts .platform {
    font-size: 1vh;
  }
  
 

  .search-btn {
    position: fixed;
    right: 3vh;
    top: 4vh;
  }
  .search-btn span {
    font-size: 3vh;
  }
  .search-btn:active {
    opacity: .5;
  }
  
  .search-div {
    position: fixed;
    width: 100%;
    height: 6vh;
    display: flex;
    flex-direction: row;
    justify-content: flex-start;
    align-items: center;
    background: rgba(000,000,000,1);
    border-bottom: 1px solid #0ef;
    top: -6vh;
    z-index: 120;
    transition: .3s;
  }
  .search-div.show-search {
    top: 0;
}
  
  .search-box {
    margin: 0 1vh;
    display: flex;
    align-items: center;
  justify-content: center;  
  }
  .search-box span {
    font-size: 3vh;
  }
  
  .input {
    width: 100%;
    height: 100%;
    inset: 0;    
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .input input {
    height: 100%;
    width: 100%;
    border: none;
    outline: none;
    font-size: 2vh;
    background: transparent;
    color: #fff;           
  }
  .input input::placeholder {
    color: #fff;
  }
  .plus {
    position: absolute;
    right: 3vh;
    font-size: 4vh;
    z-index: 99;
  }

  
</style>
</head>

<body>
  <div class="search-div">
    
    <div class="search-box">
      <span class="material-symbols-outlined">
search
</span>
    </div>
     <div class="input">
      <input class="search-input" type="text" placeholder="Search"/>
    </div>
     <div class="plus"> ×       
    </div>
    
    
  </div>
  
  
  <div class="search-btn">
    <span class="material-symbols-outlined">
search
</span>
  </div>
  <h2>APPLICATIONS</h2>
  <div class="app-list" id="app-list"></div> 
  <script src="data.js"></script>  
  


  <script type="module">
  let response = await fetch("apps.json");
let data = await response.json();
  let apps = data.apps;
    
    

    const container = document.getElementById("app-list");
    const urlParams = new URLSearchParams(window.location.search);
    let focusedAppId = urlParams.get('focus') || null;
  function render(ap=apps) {
    container.innerHTML = "";
    if(ap.length >= 1) {      

    ap.forEach(function (appItem, i) {      
        let platformss = formatPlatform(appItem.type);
        let categoriess = formatCategory(appItem.categories);
      
      const href = `download.html?id=${i}`;

      const div = document.createElement("div");
      div.className = "app-card";
      div.innerHTML = `        
          <img src="${appItem.id}.webp" alt="${appItem.name}" onerror="this.src='default-icon.png'">
          <div class="texts">
            <div class="h3">${appItem.name}</div>
        
        <div class="line_card">
             <div class="watermark">MAXAOMA</div>
        <div class="dot">•</div>
             <div class="category">${categoriess}</div>
        </div>
        <div class="platform">${platformss}</div>
        
          </div>        
      `;
      container.appendChild(div);
      

      div.addEventListener("click", function (e) {
        e.preventDefault();
      
          div.scrollIntoView({ behavior: "smooth", block: "center" });

          const newUrl = window.location.pathname + '?focus=' + encodeURIComponent(appItem.id);
          history.replaceState(null, '', newUrl);
          
          window.location.href = href;   
        
        
      });            
    });
  }    
    else {
      container.innerHTML = `
      <p>NO APPLICATIONS.</p>
      `;
    }
  }
  function sorts(a) {
    let text = a.toLowerCase().trim();
  let cleanApps = [...apps.filter(a => a.name.toLowerCase().startsWith(text) || a.name.toLowerCase().includes(text))];
    render(cleanApps);
  }
  function formatCategory(cate) {
  if (!cate) return "General";
  let cates = [];
  cate.forEach(a => {
    cates.push(categories[a]); // 'a' ayaa halkan gelaysa
  });
  if (cates.length > 1) {
    return `${cates.join(" • ")}`;
  }
  return cates[0];
}
  function formatPlatform(plat) {
    if (!plat) return "Android";
  let plats = [];
  plat.forEach(a => {
    plats.push(platforms[a]); // 'a' ayaa halkan gelaysa
  });
  if (plats.length > 1) {
    return `${plats.join(" • ")}`;
  }
  return plats[0];
  }

    
  document.querySelector(".search-input").addEventListener("input", function() {
    let value = this.value;
    sorts(value);    
  });
  document.querySelector(".search-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        sorts(this.value);
        this.value = "";
      this.blur();
        document.querySelector(".search-div").classList.remove("show-search");
    }
});
  render();
  
   
  
  </script>
  <script>
  document.querySelector(".search-btn").onclick = function () {

    document.querySelector(".search-div").classList.add("show-search");
};

document.querySelector(".plus").onclick = function () {
    document.querySelector(".search-div").classList.remove("show-search");
};  
  </script>
</body>
</html>
